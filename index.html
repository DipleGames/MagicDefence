<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111c27">
  <title>Magic Defence — 마법의 숲</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="game">
    <canvas id="world" aria-label="숲 중앙의 마법진 위에 서 있는 로우폴리 마법사"></canvas>
    <header><div class="eyebrow">MAGIC DEFENCE</div><div class="title">고요한 숲 <span>01</span></div><div class="wave">준비 단계 <i></i> WAVE 01</div></header>
    <div class="health"><span>✦</span><div><small>수호 마법사 <b>Lv. 1</b></small><div class="bar"><div></div></div></div><strong>100<em> / 100</em></strong></div>
    <button id="sound" class="view" aria-label="시점 회전">↻</button>
    <section class="bottom"><div class="hint" id="hint">마법사를 터치해 마력을 일깨우세요</div><div class="skills"><button class="skill active" data-spell="arcane"><span>✧</span><small>비전 파동</small></button><button class="skill" data-spell="fire"><span>♨</span><small>화염 폭발</small></button><button class="skill" data-spell="ice"><span>❄</span><small>서리 고리</small></button></div><div class="footer"><span>숲의 심장을 지켜주세요</span><span>✦ <b id="mana">마력 충만</b></span></div></section>
  </main>
  <script src="src/game.js"></script>
</body>
</html>

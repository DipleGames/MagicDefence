<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#94d8f4">
  <title>Magic Defence — 하늘빛 유적</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="game">
    <canvas id="world" aria-label="하늘에 떠 있는 황금빛 섬의 석판 전투장과 마법사"></canvas>
    <header class="hud">
      <button id="pause" class="pause" aria-label="일시 정지"><i></i><i></i></button>
      <div class="level"><span>Lv. 1</span><div class="xp"><div></div></div></div>
      <div class="coins"><span>◆</span> 425</div>
      <div class="stage"><span>✦</span> 하늘빛 유적 <b>01</b></div>
      <div class="wave">준비 단계</div>
    </header>
    <button id="sound" class="view" aria-label="시점 회전">↻</button>
    <div class="bottom">
      <div id="hint" class="hint">우클릭 또는 터치로 이동</div>
      <div id="joystick" class="joystick" aria-label="드래그하여 이동"><div class="joystick-thumb"></div></div>
      <div class="skills">
        <button class="skill active" data-spell="arcane" aria-label="비전 파동"><span>✧</span><small>비전</small></button>
        <button class="skill fire" data-spell="fire" aria-label="화염 폭발"><span>♨</span><small>화염</small></button>
        <button class="skill ice" data-spell="ice" aria-label="서리 고리"><span>❄</span><small>서리</small></button>
      </div>
    </div>
    <div id="pause-panel" class="pause-panel" hidden><div class="pause-card"><small>MAGIC DEFENCE</small><h1>잠시 쉬어가기</h1><p>하늘빛 유적 · 준비 단계</p><button id="resume">계속하기 <span>▶</span></button></div></div>
  </main>
  <script src="src/game.js"></script>
</body>
</html>
